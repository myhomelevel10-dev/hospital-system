<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأشعة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background: #000; color: #0f0; font-family: 'Cairo', sans-serif; padding: 15px; margin: 0; }
        .header { text-align: center; margin-bottom: 20px; color: #0ff; text-shadow: 0 0 10px #0ff; }
        .box { background: #0a0a0a; border: 1px solid #0f0; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        input, textarea, select { width: 100%; background: #000; border: 1px solid #0f0; color: #0f0; padding: 10px; border-radius: 8px; font-family: inherit; box-sizing: border-box; margin-bottom: 10px; }
        button { background: #0f0; color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <h1 class="header">🩻 شاشة الأشعة</h1>
    
    <div class="box">
        <h3>📤 إرسال صورة أشعة</h3>
        <input type="text" id="pName" placeholder="اسم المريض">
        <select id="scanType"><option>X-Ray</option><option>CT</option><option>MRI</option><option>Sonar</option></select>
        <input type="file" id="imgFile" accept="image/*" onchange="preview(event)">
        <img id="previewImg" style="max-width:100%; display:none; margin-bottom:10px; border-radius:8px;">
        <button onclick="upload()">إرسال للطبيب</button>
    </div>

    <script>
        const ws = new WebSocket(`ws://${location.host}/ws?role=dept&dept=xray`);
        let imgData = null;

        function preview(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                imgData = ev.target.result;
                const img = document.getElementById('previewImg');
                img.src = imgData; img.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function upload() {
            const name = document.getElementById('pName').value.trim();
            if (!name || !imgData) return alert('أدخل الاسم واختر صورة');
            
            ws.send(JSON.stringify({
                type: 'upload_media',
                data: { patientName: name, type: document.getElementById('scanType').value, imageUrl: imgData }
            }));
            
            document.getElementById('pName').value = '';
            imgData = null;
            document.getElementById('previewImg').style.display = 'none';
            alert('تم الإرسال للطبيب');
        }
    </script>
</body>
</html>
