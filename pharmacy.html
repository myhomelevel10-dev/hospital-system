<!DOCTYPE html>
<html lang="ar" dir="rtl" id="appHtml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>نظام الصيدلية المتكامل</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ---------- التنسيق الأساسي ---------- */
:root {
    --primary-glow: #0f0;
    --bg-color: #000;
    --font-size: 14px;
}
* { box-sizing: border-box; font-family: 'Cairo', Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg-color); color: var(--primary-glow); text-align: center; transition: background 0.3s, color 0.3s; font-size: var(--font-size); }

/* ---------- التبويبات ---------- */
.tabs-container {
    display: flex;
    width: 100%;
    background: #050505;
    padding: 8px 5px;
    border-bottom: 2px solid #222;
    position: sticky;
    top: 0;
    z-index: 1000;
    gap: 5px;
}
.tab-btn {
    flex: 1;
    font-size: clamp(0.75rem, 3vw, 1.1rem);
    font-weight: 900;
    color: #0f0;
    background: #000;
    border: 2px solid #0f0;
    padding: 10px 2px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
}
.tab-btn.active {
    color: #00ffff;
    border-color: #00ffff;
    box-shadow: 0 0 15px #00ffff, inset 0 0 10px rgba(0,255,255,0.2);
    background: #001a1a;
}
@media(min-width: 400px) { .tab-btn i { display: inline-block; margin-left: 4px; } }
@media(max-width: 399px) { .tab-btn i { display: none; } }

/* ---------- الحاويات ---------- */
.panel { display: none; padding: 15px; max-width: 1400px; margin: 0 auto; animation: fadeIn 0.4s ease; }
.panel.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* طابور المرضى */
.queue-grid { display: flex; flex-direction: column; gap: 12px; max-width: 900px; margin: 0 auto; }
.q-card { display: flex; align-items: center; justify-content: space-between; background: #050505; border: 2px solid #0f0; border-radius: 12px; padding: 8px 12px; transition: all 0.3s; box-shadow: 0 0 10px rgba(0,255,0,0.2); }
.q-card.processed { background: rgba(0,255,0,0.05); box-shadow: 0 0 15px rgba(0,255,0,0.4); }
.q-card.dummy { border-color: #ffaa00; }
.q-info { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.q-badge { border: 1.5px solid #0f0; border-radius: 8px; padding: 3px 8px; color: #0f0; font-weight: 900; font-size: 0.9rem; }
.q-name { color: #0f0; font-size: 1.3rem; font-weight: 900; text-shadow: 0 0 5px rgba(0,255,0,0.5); }
.q-actions { display: flex; align-items: center; gap: 8px; }
.q-btn { border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; border: none; font-size: 1.2rem; }
.btn-speaker { background: #ff1a1a; color: white; box-shadow: 0 0 15px rgba(255,0,0,0.6); }
.btn-print   { background: #00ffff; color: black; box-shadow: 0 0 15px rgba(0,255,255,0.6); }
.btn-insert  { background: #0f0; color: black; box-shadow: 0 0 15px rgba(0,255,0,0.6); }
.q-card.processed .q-btn { background: #333; box-shadow: none; color: #666; cursor: not-allowed; }

/* الجدول */
#panel-inventory { padding-top: 0; }
h2{color:#0ff;margin-top:15px; font-size: 1.1rem;}
table{width:100%;margin:auto;border-collapse:collapse;}
th,td{border: 2.5px solid #0f0; padding: 4px 2px; text-align:center;}
th{background:#111;color:#fff; font-size: 0.9rem;}
td{background:#000;color:#0f0; font-size: 0.95rem;}
.qty-val { color: #ff1a1a !important; font-weight: 900; font-size: 1.1em; }
.btn-del-tbl { background:#f00; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-weight: bold; }

/* الإعدادات */
.settings-section { background: #0a0a0a; border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 15px; text-align: right; }
.settings-section h3 { color: #0ff; border-bottom: 1px solid #333; padding-bottom: 8px; margin-top: 0; display: flex; align-items: center; gap: 8px; font-size: 1rem;}
.tool-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.tool-btn { background: #111; color: #0f0; border: 1px solid #0f0; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 6px; justify-content: center; transition: 0.3s; font-size: 0.85rem; }
.tool-btn:hover { background: #0f0; color: #000; }
.tool-btn.danger { border-color: #f00; color: #f00; }
.tool-btn.danger:hover { background: #f00; color: #fff; }
.setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.setting-row label { font-weight: bold; font-size: 0.9rem;}
.setting-row input, .setting-row select { width: 50%; background: #000; color: #0f0; border: 1px solid #0f0; padding: 6px; border-radius: 6px; }

/* النوافذ المنبثقة */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; backdrop-filter: blur(5px); }
.modal-overlay.active { display: flex; justify-content: center; align-items: center; }
.data-modal { background: #fff; color: #000; width: 95%; max-width: 700px; padding: 15px; border-radius: 10px; max-height: 90vh; overflow-y: auto; }
.rx-paper { padding: 10px; text-align: right; color: #000; font-family: 'Cairo', Arial, sans-serif; }
.rx-header { text-align: center; border-bottom: 3px double #000; padding-bottom: 10px; margin-bottom: 15px; }
.rx-header h1 { margin: 0; font-size: 20px; color: #000; font-weight: bold; }
.rx-header h2 { margin: 5px 0; font-size: 15px; color: #333; }
.rx-info-bar { display: flex; justify-content: space-between; font-weight: bold; font-size: 12px; margin-bottom: 15px; }
.rx-patient-info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #f0f0f0; padding: 10px; border-radius: 5px; border: 1px solid #ccc; margin-bottom: 20px; font-size: 13px; }
.rx-official-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
.rx-official-table th { background: #333 !important; color: #fff !important; padding: 6px; text-align: center; border: 1px solid #000; font-size: 12px; }
.rx-official-table td { border: 1px solid #000; padding: 6px; text-align: center; font-size: 12px; color: #000; background: #fff; }
.rx-footer { margin-top: 30px; display: flex; justify-content: space-between; align-items: flex-end; font-weight: bold; font-size: 12px; }

/* شاشة الطباعة */
@media print {
    body * { visibility: hidden; }
    #printModal, #printModal * { visibility: visible; }
    #printModal { position: absolute; left: 0; top: 0; width: 100%; background: #fff; color: #000; padding: 0; border: none; box-shadow: none; max-height: none; overflow: visible; display: block !important; }
    #printRxContent { padding: 10mm; width: 100%; max-width: 210mm; margin: 0 auto; }
    .no-print { display: none !important; }
    @page { size: A4 portrait; margin: 0; }
}

.toast-custom { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--primary-glow); color: #000; padding: 14px 24px; border-radius: 40px; font-weight: 900; z-index: 9999; box-shadow: 0 0 30px var(--primary-glow); }
</style>
</head>
<body>

<!-- شريط التبويبات -->
<div class="tabs-container">
    <button class="tab-btn active" onclick="switchTab('queue', this)"><i class="fas fa-users"></i> طابور الوصفات</button>
    <button class="tab-btn" onclick="switchTab('inventory', this)"><i class="fas fa-tablets"></i> جدول الأدوية</button>
    <button class="tab-btn" onclick="switchTab('settings', this)"><i class="fas fa-cogs"></i> الإعدادات</button>
</div>

<!-- التبويب الأول: طابور المرضى -->
<div id="panel-queue" class="panel active">
    <div class="queue-header" style="margin-bottom:10px; display:flex; justify-content:space-between;">
        <button class="tool-btn danger" onclick="clearQueue()"><i class="fas fa-trash"></i> مسح الطابور</button>
        <div id="syncStatus" style="font-size:12px; color:#0ff; align-self:center;"><i class="fas fa-sync-alt fa-spin"></i> جاري الاتصال...</div>
    </div>
    <div class="queue-grid" id="queueContainer"></div>
</div>

<!-- التبويب الثاني: جدول الأدوية -->
<div id="panel-inventory" class="panel">
    <div id="tables"></div>
</div>

<!-- التبويب الثالث: الإعدادات والأدوات -->
<div id="panel-settings" class="panel">
    
    <!-- أدوات إدارة المخزون والباركود -->
    <div class="settings-section">
        <h3><i class="fas fa-tools"></i> أدوات المخزون والباركود</h3>
        <div class="tool-grid" style="margin-bottom: 10px;">
            <input id="manual" placeholder="اسم الدواء يدوياً..." onkeydown="if(event.key==='Enter')addManual()" style="flex:2; padding:10px; border-radius:6px; border:1px solid #0f0; background:#000; color:#0f0;">
            <button class="tool-btn" onclick="addManual()"><i class="fas fa-plus"></i> إضافة</button>
        </div>
        <div class="tool-grid" style="margin-bottom: 10px;">
            <input id="barcodeInput" placeholder="امسح الباركود هنا..." onkeydown="if(event.key==='Enter')processBarcode()" style="flex:2; padding:10px; border-radius:6px; border:1px solid #0f0; background:#000; color:#0f0;">
            <button class="tool-btn" onclick="processBarcode()"><i class="fas fa-barcode"></i> إضافة باركود</button>
        </div>
        <div class="tool-grid">
            <button class="tool-btn" onclick="connectBluetooth()"><i class="fas fa-bluetooth-b"></i> ربط البلوتوث</button>
            <button class="tool-btn" onclick="exportPDF()"><i class="fas fa-print"></i> طباعة جرد A4</button>
            <button class="tool-btn danger" onclick="clearAllInventory()"><i class="fas fa-trash"></i> تصفير المخزن</button>
        </div>
        <div id="barcodeStatus" style="font-size:12px; color:#ffaa00; margin-top:10px; text-align:center;">✅ جاهز للمسح</div>
    </div>

    <!-- إدارة البيانات JSON -->
    <div class="settings-section">
        <h3><i class="fas fa-file-code"></i> إدارة البيانات (JSON)</h3>
        <div class="tool-grid">
            <button class="tool-btn" onclick="openMedDB()"><i class="fas fa-database"></i> عرض قاعدة الأدوية</button>
            <button class="tool-btn" onclick="exportMedJSON()"><i class="fas fa-file-export"></i> تصدير الأدوية</button>
            <button class="tool-btn" onclick="document.getElementById('medJsonInput').click()"><i class="fas fa-file-import"></i> استيراد الأدوية</button>
        </div>
        <input type="file" id="medJsonInput" accept=".json" style="display:none" onchange="importMedJSON(event)">
    </div>

    <!-- إعدادات المظهر -->
    <div class="settings-section">
        <h3><i class="fas fa-palette"></i> المظهر</h3>
        <div class="setting-row">
            <label>لون النيون:</label>
            <input type="color" id="setNeonColor" value="#00ff00" oninput="applySettings()">
        </div>
        <div class="setting-row">
            <label>لون الخلفية:</label>
            <input type="color" id="setBgColor" value="#000000" oninput="applySettings()">
        </div>
        <div class="setting-row">
            <label>حجم الخط:</label>
            <input type="range" id="setFontSize" min="12" max="24" value="14" oninput="applySettings()">
        </div>
    </div>
</div>

<!-- نافذة قاعدة بيانات الأدوية -->
<div class="modal-overlay" id="medDBOverlay" onclick="closeMedDB()"></div>
<div class="data-modal" id="medDBModal" style="display:none;">
    <h2 style="text-align:center; margin-top:0;">💊 قاعدة بيانات الأدوية</h2>
    <div id="medDBList" style="max-height: 60vh; overflow-y: auto;"></div>
    <button onclick="closeMedDB()" style="width:100%; padding:10px; background:#f00; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer; margin-top:10px;">إغلاق</button>
</div>

<!-- نافذة الوصفة الرسمية للطباعة -->
<div class="modal-overlay" id="printModalOverlay" onclick="closePrintModal()"></div>
<div id="printModal" class="data-modal" style="display:none; background: #fff; color: #000; max-width: 800px; padding: 0; border-radius: 8px;">
    <div id="printRxContent" class="rx-paper"></div>
    <div style="display:flex; gap:10px; padding: 15px; background: #f0f0f0; border-top: 1px solid #ccc; border-radius: 0 0 8px 8px;" class="no-print">
        <button onclick="executePrint()" style="flex:1; padding:12px; background:#0f0; color:#000; font-weight:bold; border:none; border-radius:8px; cursor:pointer; font-size:1rem;"><i class="fas fa-print"></i> طباعة الآن</button>
        <button onclick="closePrintModal()" style="flex:1; padding:12px; background:#ccc; color:#000; font-weight:bold; border:none; border-radius:8px; cursor:pointer; font-size:1rem;">إغلاق</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<script>
/* ============================================================
   WEBSOCKET CLIENT
   ============================================================ */
class HospitalClient {
  constructor(opts) {
    this.params = opts.params || {};
    this.onMessage = opts.onMessage || (()=>{});
    this.onOpen = opts.onOpen || (()=>{});
    this.onClose = opts.onClose || (()=>{});
    this.ws = null;
    this.reconnectDelay = 1000;
    this.connected = false;
  }
  connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const qs = new URLSearchParams(this.params).toString();
    this.ws = new WebSocket(proto + '//' + location.host + '/ws?' + qs);
    this.ws.onopen = () => { this.connected = true; this.reconnectDelay = 1000; this.onOpen(); };
    this.ws.onmessage = e => { try { this.onMessage(JSON.parse(e.data)); } catch(err) { console.error(err); } };
    this.ws.onclose = () => {
      this.connected = false; this.onClose();
      setTimeout(() => this.connect(), this.reconnectDelay);
      this.reconnectDelay = Math.min(this.reconnectDelay * 2, 30000);
    };
    this.ws.onerror = () => {};
  }
  send(type, data) {
    if (this.ws && this.ws.readyState === 1) {
      this.ws.send(JSON.stringify({ type, data }));
      return true;
    }
    return false;
  }
}

const client = new HospitalClient({
    params: { role: 'dept', dept: 'pharmacy' },
    onMessage: handleServerMessage,
    onOpen: () => {
        document.getElementById('syncStatus').innerHTML = '<i class="fas fa-sync-alt"></i> متصل بالشبكة';
        document.getElementById('syncStatus').style.color = '#0f0';
        client.send('request_sync', {}); 
    },
    onClose: () => {
        document.getElementById('syncStatus').innerHTML = '<i class="fas fa-sync-alt fa-spin"></i> غير متصل';
        document.getElementById('syncStatus').style.color = '#ff1a1a';
    }
});

function handleServerMessage(msg) {
    if (msg.type === 'new_order') {
        let orders = JSON.parse(localStorage.getItem("neon_pharma") || '[]');
        // إزالة الوهمي إذا كان موجوداً ثم إضافة الوصفة الحقيقية
        orders = orders.filter(o => !(o.isDummy && String(o.patientId) === String(msg.order.patientId)));
        
        if (!orders.some(o => String(o.id) === String(msg.order.id))) {
            orders.push(msg.order);
            localStorage.setItem("neon_pharma", JSON.stringify(orders));
            loadQueue();
            playBeep(880);
            showToast('🔔 وصلت وصفة جديدة');
        }
    } 
    else if (msg.type === 'init') {
        // استقبال جميع الوصفات من السيرفر عند الاتصال
        if (msg.pharmacyOrders) {
            let localOrders = JSON.parse(localStorage.getItem("neon_pharma") || '[]');
            let merged = [...localOrders];
            msg.pharmacyOrders.forEach(so => {
                if (!merged.some(lo => String(lo.id) === String(so.id))) {
                    merged.push(so);
                }
            });
            localStorage.setItem("neon_pharma", JSON.stringify(merged));
            loadQueue();
        }
    }
    else if (msg.type === 'patient_added' || msg.type === 'patient_updated') {
        // إذا تم توجيه مريض للصيدلية ولم تصل وصفته بعد، نضيفه كـ "بانتظار الوصفة"
        if (msg.patient && msg.patient.current_dept === 'pharmacy' && msg.patient.status !== 'discharged') {
            let orders = JSON.parse(localStorage.getItem("neon_pharma") || '[]');
            let hasOrder = orders.some(o => String(o.patientId) === String(msg.patient.id));
            
            if (!hasOrder) {
                orders.push({
                    id: 'DUMMY-' + msg.patient.id,
                    patientId: msg.patient.id,
                    patientName: msg.patient.name,
                    doctor: msg.patient.doctor || 'غير محدد',
                    diagnosis: 'بانتظار وصفة الطبيب...',
                    medicines: [],
                    time: new Date().toISOString(),
                    isDummy: true
                });
                localStorage.setItem("neon_pharma", JSON.stringify(orders));
                loadQueue();
            }
        }
    }
}

/* ============================================================
   UTILS
   ============================================================ */
function showToast(m) {
    const t = document.createElement('div'); t.className = 'toast-custom'; t.innerHTML = m;
    document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
}
function playBeep(freq = 880) {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = freq; gain.gain.value = 0.2;
        osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.15);
        osc.stop(ctx.currentTime + 0.15);
    } catch(e) {}
}

// =============== نظام التبويبات ===============
function switchTab(tabName, btn) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('panel-' + tabName).classList.add('active');
    if(btn) btn.classList.add('active');
}

/* ============================================================
   دالة ربط نوع الطبيب بنوع الجدول
   ============================================================ */
function mapDoctorTypeToCategory(type) {
    switch(type) {
        case 'pills': return 'Tablets';
        case 'capsule': return 'Capsules';
        case 'syrup': return 'Syrups';
        case 'drops': return 'Drops';
        case 'ointment': return 'Creams & Ointments';
        case 'supplies': return 'Supplies';
        case 'ampoule': return 'Ampoules';
        default: return 'Others';
    }
}

/* ============================================================
   1. نظام طابور المرضى
   ============================================================ */
function loadQueue() {
    let orders = JSON.parse(localStorage.getItem("neon_pharma") || '[]');
    let container = document.getElementById("queueContainer");

    if (orders.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:#666; padding:20px;">لا توجد وصفات واردة حالياً.</div>`;
        return;
    }

    container.innerHTML = orders.map((ord, index) => {
        let isProcessed = ord.processed === true;
        let cardClass = isProcessed ? 'processed' : (ord.isDummy ? 'dummy' : '');

        return `
        <div class="q-card ${cardClass}">
            <div class="q-info">
                <span class="q-badge" style="${ord.isDummy ? 'border-color:#ffaa00; color:#ffaa00;' : ''}"># ${index+1} (${ord.consult || (ord.isDummy ? 'بانتظار الوصفة' : 'عام')})</span>
                <span class="q-name" style="${ord.isDummy ? 'color:#ffaa00;' : ''}">${ord.patientName}</span>
            </div>
            <div class="q-actions">
                <button class="q-btn btn-print" onclick="openPrintModal(${index})" title="طباعة كاشير">
                    <i class="fas fa-print"></i>
                </button>
                <button class="q-btn btn-insert" onclick="insertToTable(${index})" title="إدراج للجدول" ${isProcessed || ord.isDummy ? 'disabled' : ''}>
                    <i class="fas fa-arrow-left"></i>
                </button>
                <button class="q-btn btn-speaker" onclick="callPatient('${ord.patientName}')" title="نداء المريض">
                    <i class="fas fa-bullhorn"></i>
                </button>
            </div>
        </div>`;
    }).join("");
}

function callPatient(name) {
    if (!('speechSynthesis' in window)) return;
    let msg = new SpeechSynthesisUtterance(`المريض ${name} يرجى التوجه إلى الصيدلية`);
    msg.lang = 'ar-SA'; window.speechSynthesis.speak(msg);
}

// دالة إدراج الأدوية في الجدول
function insertToTable(index) {
    let orders = JSON.parse(localStorage.getItem("neon_pharma") || '[]');
    let order = orders[index];
    if (!order || order.processed) return;
    if (order.isDummy) { showToast('⏳ بانتظار وصول الوصفة من الطبيب'); return; }

    order.medicines.forEach(med => {
        let cat = mapDoctorTypeToCategory(med.type);
        let qty = parseInt(med.qty) || 1;
        if(!inventory[cat]) inventory[cat] = {};
        inventory[cat][med.name] = (inventory[cat][med.name] || 0) + qty;
        update(cat); 
    });
    save();

    order.processed = true;
    localStorage.setItem("neon_pharma", JSON.stringify(orders));
    loadQueue();
    switchTab('inventory', document.querySelectorAll('.tab-btn')[1]);
}

// دالة فتح نافذة الوصفة الرسمية
function openPrintModal(index) {
    let orders = JSON.parse(localStorage.getItem("neon_pharma") || '[]');
    let order = orders[index];
    if (!order) return;

    if (order.isDummy) { showToast('⏳ لا يمكن الطباعة، بانتظار وصول الوصفة من الطبيب'); return; }

    if (!order.processed) {
        insertToTable(index); 
    }

    let medsHtml = order.medicines.map((m, i) => `
        <tr>
            <td>${i+1}</td>
            <td>${m.name}</td>
            <td>${m.instructions || '---'}</td>

function clearQueue() {
    if(confirm("مسح طابور المرضى من هذه الشاشة؟ (لن يؤثر على الوصفات المحفوظة)")) {

/* ============================================================
   2. كود الجدول (المخزون)
   ============================================================ */
const rules={
 "Drops":["drop","drops","eye"], "Syrups":["syrup"], "Tablets":["tablet","pill","tab"],
 "Capsules":["capsule","cap"], "Creams & Ointments":["cream","ointment"],
 "Supplies":["mask","syringe","gauze"], "Ampoules":["ampoule","amp","vial","inj","injection"],
 "Laboratory Tests":["test","strip"], "Controlled Drugs":["diazepam","tramadol","morphine"]
};

let inventory={};
Object.keys(rules).forEach(c=>inventory[c]={});
inventory["Others"]={};

const container=document.getElementById("tables");

function init(){
 container.innerHTML="";
 for(let c in inventory){
  container.innerHTML+=`<h2>${c}</h2><table id="t_${c}"><tr><th>Item</th><th>Qty</th><th>Action</th></tr></table>`;
 }
}
init();

function detectCategory(text){
 text=text.toLowerCase();
 for(let c in rules){ if(rules[c].some(k=>text.includes(k))) return c; }
 return "Others";
}

function addItem(text){
 if(!text) return;
 let cat=detectCategory(text);
 inventory[cat][text]=(inventory[cat][text]||0)+1;
 update(cat); save(); speakDrugName(text);
}

function update(cat){
 let t=document.getElementById("t_"+cat);
 if(!t) return;
 t.innerHTML="<tr><th>Item</th><th>Qty</th><th>Action</th></tr>";
 for(let i in inventory[cat]){
  t.innerHTML+=`<tr>
   <td>${i}</td>
   <td><button onclick="changeQty('${cat}','${i}',-1)">-</button> <span class="qty-val">${inventory[cat][i]}</span> <button onclick="changeQty('${cat}','${i}',1)">+</button></td>
   <td><button class="btn-del-tbl" onclick="removeItem('${cat}','${i}')">Delete</button></td>
  </tr>`;
 }
}

function changeQty(cat,item,delta){
 inventory[cat][item]=Math.max(0,(inventory[cat][item]||0)+delta);
 update(cat); save(); speakDrugName(item);
}

function removeItem(cat,item){
 if(confirm("Delete this item?")){ delete inventory[cat][item]; update(cat); save(); }
}

function addManual(){let v=document.getElementById("manual"); addItem(v.value.trim()); v.value="";}

function save(){
    localStorage.setItem("pharmacy_inventory_adv",JSON.stringify(inventory));
    let drInventory = [];
    for(let c in inventory) { for(let name in inventory[c]) { drInventory.push({ name: name, category: c, stock: inventory[c][name] }); } }
    localStorage.setItem("neon_inventory", JSON.stringify(drInventory));
}

function load(){
 let d=localStorage.getItem("pharmacy_inventory_adv");
 if(d){ inventory=JSON.parse(d); init(); for(let c in inventory) update(c); }
}
load();

function clearAllInventory(){
 if(confirm("مسح جميع أدوية المخزن؟")){
  inventory={}; Object.keys(rules).forEach(c=>inventory[c]={}); inventory["Others"]={};
  localStorage.removeItem("pharmacy_inventory_adv"); init();
 }
}

/* ============================================================
   3. الأدوات (البلوتوث، الصوت، الطباعة A4، JSON)
   ============================================================ */
let selectedFemaleVoice = null;
function initTTS() {
    if (!('speechSynthesis' in window)) return;
    const voices = window.speechSynthesis.getVoices();
    const femaleVoices = voices.filter(v => v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('samantha'));
    selectedFemaleVoice = femaleVoices[0] || voices[0] || null;
}
function speakDrugName(drugName) {
    if (!('speechSynthesis' in window) || !drugName) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(drugName);
    if (selectedFemaleVoice) u.voice = selectedFemaleVoice;
    u.pitch = 1.6; u.rate = 1.0; u.lang = 'en-US';
    window.speechSynthesis.speak(u);
}
window.addEventListener('DOMContentLoaded', initTTS);

let barcodeDatabase = {};
function saveBarcodeDB() { localStorage.setItem("pharmacy_barcode_db", JSON.stringify(barcodeDatabase)); }
function loadBarcodeDB() { barcodeDatabase = JSON.parse(localStorage.getItem("pharmacy_barcode_db") || '{}'); }

function processBarcode() {
    let inputField = document.getElementById("barcodeInput");
    let barcode = inputField.value.trim();
    if(!barcode) return;
    if(barcodeDatabase[barcode]) {
        addItem(barcodeDatabase[barcode]);
    } else {
        let newDrug = prompt("باركود جديد! اسم الدواء:");
        if(newDrug) { barcodeDatabase[barcode] = newDrug; saveBarcodeDB(); addItem(newDrug); }
    }
    inputField.value = ""; inputField.focus();
}

let bleDevice = null;
async function connectBluetooth() {
    try {
        bleDevice = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb','0000ffe0-0000-1000-8000-00805f9b34fb'] });
        const server = await bleDevice.gatt.connect();
        const services = await server.getPrimaryServices();
        for (const service of services) {
            const characteristics = await service.getCharacteristics();
            for (const c of characteristics) {
                if (c.properties.notify) {
                    await c.startNotifications();
                    c.addEventListener('characteristicvaluechanged', (e) => {
                        let val = new TextDecoder('utf-8').decode(e.target.value).trim();
                        if(val.includes('\n')) { document.getElementById('barcodeInput').value = val.replace('\n',''); processBarcode(); }
                    });
                }
            }
        }
        document.getElementById("barcodeStatus").innerText = "✅ متصل بالبلوتوث";
    } catch (e) { alert('خطأ في البلوتوث: ' + e.message); }
}

function exportPDF() {
    let printDiv = document.getElementById("printModal");
    let html = `<h2 style="text-align:center; color:#000;">تقرير الجرد - ${new Date().toLocaleDateString('ar-EG')}</h2><table style="width:100%; border-collapse:collapse; color:#000; font-family:Cairo;">`;
    for(let c in inventory) {
        let items = Object.entries(inventory[c]);
        if(items.length > 0) {
            html += `<tr><th colspan="2" style="background:#eee; border:1px solid #000; text-align:right;">${c}</th></tr>`;
            items.forEach(([name, qty]) => { html += `<tr><td style="border:1px solid #000; padding:8px;">${name}</td><td style="border:1px solid #000; padding:8px; text-align:center;">${qty}</td></tr>`; });
        }
    }
    html += `</table>`;
    document.getElementById("printRxContent").innerHTML = html;
    document.getElementById("printModal").style.display = "block";
    document.getElementById("printModalOverlay").classList.add("active");
    setTimeout(() => { window.print(); }, 300);
}

function openMedDB() {
    let list = document.getElementById('medDBList');
    let html = `<table style="width:100%; border-collapse:collapse;"><tr><th style="border:1px solid #ccc; padding:6px; background:#eee;">الدواء</th><th style="border:1px solid #ccc; padding:6px; background:#eee;">الكمية</th></tr>`;
    for(let c in inventory) { for(let name in inventory[c]) { html += `<tr><td style="border:1px solid #ccc; padding:6px; text-align:right;">${name} (${c})</td><td style="border:1px solid #ccc; padding:6px; text-align:center;">${inventory[c][name]}</td></tr>`; } }
    html += `</table>`;
    list.innerHTML = html;
    document.getElementById("medDBOverlay").classList.add("active");
    document.getElementById("medDBModal").style.display = "block";
}
function closeMedDB() { document.getElementById("medDBOverlay").classList.remove("active"); document.getElementById("medDBModal").style.display = "none"; }

function exportMedJSON() {
    let data = JSON.stringify(inventory, null, 2);
    let blob = new Blob([data], { type: "application/json" });
    saveAs(blob, "medicines.json");
}

function importMedJSON(event) {
    let file = event.target.files[0];
    if(!file) return;
    let reader = new FileReader();
    reader.onload = function(e) {
        try {
            let imported = JSON.parse(e.target.result);
            inventory = imported;
            save(); init(); for(let c in inventory) update(c);
            alert("✅ تم استيراد الأدوية بنجاح");
        } catch(err) { alert("❌ ملف غير صالح"); }
    };
    reader.readAsText(file); event.target.value = '';
}

function applySettings() {
    let neon = document.getElementById('setNeonColor').value;
    let bg = document.getElementById('setBgColor').value;
    let fontSize = document.getElementById('setFontSize').value + 'px';
    document.documentElement.style.setProperty('--primary-glow', neon);
    document.documentElement.style.setProperty('--bg-color', bg);
    document.documentElement.style.setProperty('--font-size', fontSize);
    localStorage.setItem("pharm_set_neon", neon);
    localStorage.setItem("pharm_set_bg", bg);
    localStorage.setItem("pharm_set_font", fontSize);
}

function loadSettings() {
    let neon = localStorage.getItem("pharm_set_neon") || "#00ff00";
    let bg = localStorage.getItem("pharm_set_bg") || "#000000";
    let font = localStorage.getItem("pharm_set_font") || "14px";
    document.getElementById('setNeonColor').value = neon;
    document.getElementById('setBgColor').value = bg;
    document.getElementById('setFontSize').value = parseInt(font);
    applySettings();
}

document.addEventListener('DOMContentLoaded', () => { 
    loadQueue(); 
    loadSettings(); 
    loadBarcodeDB();
    client.connect(); // بدء الاتصال بالخادم
});
</script>
